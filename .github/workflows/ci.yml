name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes markdownlint-cli2@0.18.1
      - name: Agent config is valid JSON
        run: jq empty .claude/settings.json
      - name: Hook scripts are executable
        run: test -z "$(find .claude/hooks scripts -name '*.sh' ! -perm -u+x)"

  build:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - id: gradle
        run: echo "present=$([ -f gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.gradle.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.gradle.outputs.present == 'true'
        run: ./gradlew check --no-daemon
      - if: steps.gradle.outputs.present == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/"
      - if: steps.gradle.outputs.present != 'true'
        run: echo "Gradle not set up yet (AM-101); skipping build."
